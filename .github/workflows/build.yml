name: Build & Test (Stonecutter)

# 2026-09-21 重写: 原工作流是**旧生成器时代**遗留 (调用 `just build-loader` / `just test` 配方, 但 justfile
# (266 行) 里没有这两个配方 ⇒ 一跑就失败; 且 `working-directory: ${{matrix.version}}` +
# `$version/$loader/build.gradle` 的路径假设与本仓 Stonecutter 布局不符 ✗)。现在按**实测**的真实入口重写:
#   · 节点表 = `just list-nodes` 实测 (1.20.1-forge · 1.21.1-neoforge) ⇒ 新增节点时同步下面 matrix
#   · 构建 = `just build <node>` = `./gradlew --configure-on-demand ":<loader>:<mc>:build"` (含单测 + 出 jar)
#   · 单测 = `:<loader>:<mc>:test` (独立作业, 失败可一眼定位; neo 端无单测源 = NO-SOURCE 属正常)
#   · gametest = `:<loader>:<mc>:runGameTestServer` (端到端) + **必须 grep 判定行** —— mod 加载失败时
#     Gradle 仍可能 BUILD SUCCESSFUL = 假绿形态之一 (见 docs/ARCHITECTURE.md 基线表备注) ✗
#   · CI 有网 ⇒ 不传 --offline; build-java = 21 (两节点 `versions/*/gradle.properties` 实测)
#   · 不引用 docs/ scripts/ build-logs/ (均未受 git 跟踪); 发版仍由用户手动上传 Release ✓

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "1.20.1-forge"
            loader: forge
            mc: "1.20.1"
            java: "21"
          - node: "1.21.1-neoforge"
            loader: neoforge
            mc: "1.21.1"
            java: "21"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "${{ matrix.java }}"
      - uses: gradle/actions/setup-gradle@v3
      - uses: taiki-e/install-action@just
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build (compile + unit tests + jar) — just build ${{ matrix.node }}
        run: just build "${{ matrix.node }}"
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.mc }}-${{ matrix.loader }}
          path: ${{ matrix.loader }}/versions/${{ matrix.mc }}/build/libs/*.jar
          if-no-files-found: error

  unit-tests:
    name: unit tests ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "1.20.1-forge"
            loader: forge
            mc: "1.20.1"
            java: "21"
          - node: "1.21.1-neoforge"
            loader: neoforge
            mc: "1.21.1"
            java: "21"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "${{ matrix.java }}"
      - uses: gradle/actions/setup-gradle@v3
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Unit tests (含 ArchGuard / ReadmeDrift / TaskRegistryDrift 守护)
        run: ./gradlew --configure-on-demand ":${{ matrix.loader }}:${{ matrix.mc }}:test" --console=plain

  gametest:
    name: gametest ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "1.20.1-forge"
            loader: forge
            mc: "1.20.1"
            java: "21"
          - node: "1.21.1-neoforge"
            loader: neoforge
            mc: "1.21.1"
            java: "21"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "${{ matrix.java }}"
      - uses: gradle/actions/setup-gradle@v3
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Clean gametest world (必须; 残留状态会污染)
        run: rm -rf "${{ matrix.loader }}/versions/${{ matrix.mc }}/run/gametest"
      - name: Run gametest server
        run: |
          set -o pipefail
          ./gradlew --configure-on-demand ":${{ matrix.loader }}:${{ matrix.mc }}:runGameTestServer" --console=plain 2>&1 | tee gametest.log
      - name: Verify verdict line (防假绿)
        run: |
          if ! grep -qE "All [0-9]+ required tests passed" gametest.log; then
            echo "::error::未找到 'All N required tests passed' 判定行 — 视为失败 (可能 mod 加载失败/有用例红)"
            grep -nE "required tests failed|failed!" gametest.log | head -20 || true
            tail -n 80 gametest.log
            exit 1
          fi
      - name: Upload gametest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-log-${{ matrix.mc }}-${{ matrix.loader }}
          path: gametest.log
          if-no-files-found: ignore
