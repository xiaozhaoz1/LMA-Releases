plugins {
    id 'com.iamkaf.multiloader.forge'
    id 'java-library'
}

def minecraftVersion = project.name
def useTeaKit = providers.systemProperty('template.withTeaKit')
    .orElse(providers.gradleProperty('template.withTeaKit'))
    .map { it.toBoolean() }
    .orElse(false)
    .get()
def libs = catalogFor(project, minecraftVersion)

repositories {
    maven { url "https://maven.shedaniel.me/" }
    // 本地 maven repo: TLM jar (modImplementation 坐标重映射 mixin refmap — 对齐 cloth 处理)
    maven { url = uri(rootProject.file('libs-maven').toURI()) }
}

dependencies {
    // TLM 1.20.1 (本地 maven repo, modImplementation 自动重映射)
    modImplementation 'com.github.tartaricacid:touhoulittlemaid:1.5.3'
    // Cloth Config
    modImplementation 'me.shedaniel.cloth:cloth-config-forge:11.1.136'
    // ClassGraph (mod 运行时依赖 — dev runClient 类路径可见)
    modImplementation 'io.github.classgraph:classgraph:4.8.168'

    if (useTeaKit && minecraftVersion != '1.16.5' && !useLegacyForgeRunPath) {
        runtimeOnly library(libs, 'teakit-forge')
    }
}

dependencies {
    // 1.20.1 compat 前置 (compileOnly, 运行时门控)
    compileOnly files(
            rootProject.file('libs/create-1.20.1-6.0.8.jar'),
            rootProject.file('libs/Ponder-Forge-1.20.1-1.0.91.jar'),
            rootProject.file('libs/flywheel-forge-1.20.1-1.0.5.jar'),
            rootProject.file('libs/createbigcannons-5.11.4-mc.1.20.1-forge.jar'),
            rootProject.file('libs/SlashBladeResharped-1.20.1.jar'),
            rootProject.file('libs/mrqxs_Slashblade_Core-1.20.1-1.4.1.jar'),
            rootProject.file('libs/True_POWER-1.20.1-1.1.8.jar'),
            rootProject.file('libs/True_POWER_of_Maid-1.20.1-1.2.2.jar')
    )
}

// 抑制 JDK 21 对 MC 已过时 API 的 removal 警告 (视为错误)
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-Xlint:-removal"]
}

// multiloader 插件 filesMatching expand 用 Windows 默认编码(GBK)读 UTF-8 中文注释写坏 mods.toml
// (forge FML 47.x GBK 容忍不炸但产物损坏, 与 neoforge 节点同源问题) — 显式 UTF-8
tasks.named('processResources') {
    filteringCharset = 'UTF-8'
}

// 测试源: 复用 common 测试 (loader 类路径含 Forge) — common 节点独立编译缺 forge 类路径, 测试跑在 forge 节点
sourceSets.test.java.srcDirs = [rootProject.file('common/src/test/java')]
// stonecutter 合成节点 test 源集未自动继承 main 类路径 (MC/forge 依赖) — 显式继承
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
test {
    useJUnitPlatform()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    // 任务系统状态机单元测试 (mock EntityMaid — 纯 JVM)
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    // Gradle 9 要求 launcher 在测试运行时类路径
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// gametest run (forge 节点 = ModDevGradle legacyforge, legacyForge runs DSL)
// 参考: TLM 1.20 ForgeGradle 同款语义 (forge.gameTestServer=true + 启用 LMA 命名空间)
legacyForge {
    runs {
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run/gametest')
            systemProperty 'forge.enabledGameTestNamespaces', 'littlemaidmoreaction'
            systemProperty 'forge.gameTestServer', 'true'
        }
    }
}
