org.gradle.jvmargs=-Xmx4G
org.gradle.workers.max=4
org.gradle.parallel=true

# Shared project metadata
project.group=com.github.xiaozhaoz1
project.plugins=2.1.2

# Shared mod metadata
mod.name=Little Maid More Action
mod.authors=xiaozhaoz1
mod.id=littlemaidmoreaction
mod.license=MIT
mod.credits=
mod.description=An addon mod for Touhou Little Maid, adding more maid actions.

# Shared publishing defaults
publish.dry-run=false
publish.curseforge.id=000
publish.modrinth.id=xxx
publish.release-type=release
publish.game-versions=auto
environments.client=required
environments.server=required

# Gradle 守护进程 JVM (settings 插件要求 21+; 编译 toolchain 按节点 project.java)
# 机器特定 JDK 路径已移至 ~/.gradle/gradle.properties (用户级), 仓库不携带本机路径
# 本机构建依赖: ~/.gradle/gradle.properties 中的 org.gradle.java.home, 或 JAVA_HOME 环境变量

# 本机代理 (国内网络): 已移至 ~/.gradle/gradle.properties (用户级), 避免仓库内机器特定配置
